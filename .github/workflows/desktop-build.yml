name: Desktop build

# Builds the Enterprise RAG desktop app (Tauri shell + frozen FastAPI backend
# sidecar) for Windows and Linux. Runs on tags (v*) and manual dispatch.
# Artifacts: Windows .msi/.exe (NSIS), Linux .AppImage/.deb.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      flavour:
        description: "Backend flavour (lite = fastembed only, full = +torch)"
        required: false
        default: "lite"
        type: choice
        options: ["lite", "full"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            sidecar_src: backend/dist/rag-backend.exe
            sidecar_ext: ".exe"
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            sidecar_src: backend/dist/rag-backend
            sidecar_ext: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── System deps (Linux: webkit2gtk 4.1 + appimage tooling) ────────
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            build-essential \
            curl wget file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.toml') }}

      # ── Backend: install deps + freeze with PyInstaller ───────────────
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Freeze backend
        working-directory: backend
        env:
          RAG_BUILD: ${{ github.event.inputs.flavour || 'lite' }}
        run: pyinstaller rag-backend.spec --noconfirm --distpath dist --workpath build_pyi

      - name: Stage sidecar binary
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp "${{ matrix.sidecar_src }}" \
             "frontend/src-tauri/binaries/rag-backend-${{ matrix.triple }}${{ matrix.sidecar_ext }}"
          chmod +x "frontend/src-tauri/binaries/rag-backend-${{ matrix.triple }}${{ matrix.sidecar_ext }}" || true

      # ── Frontend + Tauri build ────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Tauri app
        working-directory: frontend
        run: npm run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-rag-${{ matrix.triple }}
          path: |
            frontend/src-tauri/target/release/bundle/**/*.msi
            frontend/src-tauri/target/release/bundle/**/*.exe
            frontend/src-tauri/target/release/bundle/**/*.AppImage
            frontend/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
